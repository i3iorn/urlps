name: Publish to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

# Supply-chain notes:
# - Every action is pinned to a full commit SHA (the tag is in the comment);
#   Dependabot's github-actions updates keep the pins current.
# - The OIDC token (id-token: write) exists only in the `publish` job, which
#   runs no build tooling: it downloads the already-built, already-checked
#   distributions and hands them to the PyPI action. Building happens in a
#   job without the token, from hash-pinned tools (.github/requirements/).
# - Protect the `pypi` environment with required reviewers in the repository
#   settings so a published release still needs a human to approve the upload.

jobs:
  verify:
    name: Verify release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install package and dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ".[dev]"

      - name: Run tests
        run: pytest -q --cov=urlps --cov-report=term-missing

      - name: Lint (ruff)
        run: ruff check src/ tests/

      - name: Type check (mypy)
        run: mypy src/urlps --ignore-missing-imports

      - name: Security scan (bandit)
        run: bandit -r src/urlps -ll

      - name: Verify tag matches __version__
        shell: bash
        run: |
          pkg_version="$(python -c 'import urlps; print(urlps.__version__)')"
          tag_version="${GITHUB_REF_NAME#v}"

          echo "package=$pkg_version"
          echo "tag=$tag_version"

          if [ "$pkg_version" != "$tag_version" ]; then
            echo "::error::Tag $tag_version does not match __version__ $pkg_version"
            exit 1
          fi

  build:
    name: Build distributions
    runs-on: ubuntu-latest
    needs: verify

    steps:
      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install hash-pinned build tooling
        run: pip install --require-hashes -r .github/requirements/release.txt

      - name: Build package
        # --no-isolation: build with the pinned setuptools/wheel above rather
        # than letting `build` download unpinned ones into a fresh env.
        run: python -m build --no-isolation

      - name: Validate distributions
        run: twine check dist/*

      - name: Upload distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          retention-days: 7

  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: build

    environment:
      name: pypi

    permissions:
      id-token: write

    steps:
      - name: Download distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          verbose: true
