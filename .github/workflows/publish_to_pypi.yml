name: Publish to PyPI

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  verify:
    name: Verify release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip

      - name: Verify tag is on master
        shell: bash
        run: |
          git fetch origin master --tags

          tag_commit="$(git rev-parse "${GITHUB_REF_NAME}^{commit}")"
          master_commit="$(git rev-parse origin/master)"

          echo "tag=${GITHUB_REF_NAME}"
          echo "tag_commit=$tag_commit"
          echo "master_commit=$master_commit"

          if [ "$tag_commit" != "$master_commit" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} must point to the current HEAD of master"
            exit 1
          fi

      - name: Install package and dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ".[dev]"

      - name: Run tests
        run: pytest -q --cov=urlps --cov-report=term-missing

      - name: Lint (ruff)
        run: ruff check src/ tests/

      - name: Type check (mypy)
        run: mypy src/urlps --ignore-missing-imports

      - name: Security scan (bandit)
        run: bandit -r src/urlps -ll

      - name: Verify tag matches __version__
        shell: bash
        run: |
          pkg_version="$(python -c 'import urlps; print(urlps.__version__)')"
          tag_version="${GITHUB_REF_NAME#v}"

          echo "package=$pkg_version"
          echo "tag=$tag_version"

          if [ "$pkg_version" != "$tag_version" ]; then
            echo "::error::Tag $tag_version does not match __version__ $pkg_version"
            exit 1
          fi

  publish:
    name: Build and publish to PyPI
    runs-on: ubuntu-latest
    needs: verify

    environment:
      name: pypi

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build package
        run: python -m build

      - name: Validate distributions
        run: twine check dist/*

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          verbose: true
