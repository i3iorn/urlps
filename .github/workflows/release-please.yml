name: release-please

on:
  push:
    branches:
      - master

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          # A release created with the default GITHUB_TOKEN does not fire
          # other workflows' `release:` triggers (GitHub suppresses
          # cascading runs from the built-in token) -- publish_to_pypi.yml's
          # `on: release: published` would otherwise never fire. Use a
          # *fine-grained* PAT (or a GitHub App token) restricted to this one
          # repository with only Contents: read/write and Pull requests:
          # read/write, stored as the RELEASE_PLEASE_TOKEN repo secret -- not a
          # classic PAT, whose `repo` scope covers every repository you own.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
