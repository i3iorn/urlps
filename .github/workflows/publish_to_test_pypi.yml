name: Publish to Test PyPI

on:
  push:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: read

# Same supply-chain shape as publish_to_pypi.yml: SHA-pinned actions, a build
# job without the OIDC token using hash-pinned tools, and a publish job that
# only uploads the artifact.

jobs:
  verify:
    name: Verify before publishing
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install package and dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ".[dev]"

      - name: Run tests
        run: pytest -q --cov=urlps --cov-report=term-missing

      - name: Lint (ruff)
        run: ruff check src/ tests/

      - name: Type check (mypy)
        run: mypy src/urlps --ignore-missing-imports

      - name: Security scan (bandit)
        run: bandit -r src/urlps -ll

  build:
    name: Build distributions
    runs-on: ubuntu-latest
    needs: verify

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install hash-pinned build tooling
        run: pip install --require-hashes -r .github/requirements/release.txt

      - name: Build package
        run: python -m build --no-isolation

      - name: Validate distributions
        run: twine check dist/*

      - name: Upload distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          retention-days: 7

  publish:
    name: Publish to Test PyPI
    runs-on: ubuntu-latest
    needs: build

    environment:
      name: testpypi

    permissions:
      id-token: write

    steps:
      - name: Download distributions
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: dist
          path: dist/

      - name: Publish to Test PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true
          verbose: true
