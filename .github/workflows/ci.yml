name: CI

on:
  push:
    branches: [ master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ master ]
  workflow_dispatch: {}

jobs:
  test-build:
    name: Test, Audit and Build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.10, 3.11, 3.12]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/pyproject.toml','**/requirements-dev.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install build & test tools
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade build twine
          # CI-only tooling not part of the package's own dev extras
          pip install pytest-cov pip-audit
          # install package with dev extras (pytest, mypy, bandit, idna) from
          # pyproject.toml so CI tooling can't drift out of sync with it
          pip install ".[dev]"

      - name: Run tests
        run: pytest -q

      - name: Run mypy
        run: mypy src/urlps --ignore-missing-imports || true

      - name: Run Bandit security scan
        run: bandit -r src/urlps -lll || true

      - name: Dependency audit (pip-audit)
        run: pip-audit --progress-spinner off || true

      - name: Build sdist and wheel
        run: python -m build

      - name: Validate distributions with twine
        run: twine check dist/*
