name: CI

on:
  push:
    branches: [ master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ master ]
  workflow_dispatch: {}

# Superseded runs on the same ref are pointless; cancel them.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        include:
          # The library does socket/IDNA/Unicode work that behaves differently
          # on Windows, and it is developed there. Cover it on one version.
          - os: windows-latest
            python-version: "3.12"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ".[dev]"

      - name: Run tests with coverage
        # fail_under is enforced via [tool.coverage.report] in pyproject.toml.
        run: pytest -q --cov=urlps --cov-report=term-missing

      - name: Assert property-based tests actually ran
        # These silently degraded to ~48 skips whenever hypothesis was missing.
        # Fail loudly rather than let security tests quietly stop running.
        shell: bash
        run: |
          python -c "import hypothesis; print('hypothesis', hypothesis.__version__)"
          pytest tests/security/test_security_fuzzing.py -q --no-header -p no:cacheprovider \
            | tee /tmp/fuzz.txt
          if grep -qi "skipped" /tmp/fuzz.txt; then
            echo "::error::Property-based security tests were skipped."
            exit 1
          fi

  quality:
    name: Lint, types and security
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package and dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ".[dev]" pip-audit

      # All three of these were previously `|| true` and could never fail the
      # build. They are gates now.
      - name: Lint (ruff)
        run: ruff check src/ tests/

      - name: Format check (ruff format)
        run: ruff format --check src/ tests/

      - name: Type check (mypy)
        run: mypy src/urlps --ignore-missing-imports

      - name: Security scan (bandit)
        run: bandit -r src/urlps -ll

      # Advisory by design: a newly-disclosed CVE in a transitive dependency
      # should not block an unrelated PR. Surfaced in the log for triage.
      - name: Dependency audit (pip-audit)
        run: pip-audit --progress-spinner off || true

  build:
    name: Build and validate distributions
    runs-on: ubuntu-latest
    needs: [test, quality]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build sdist and wheel
        run: python -m build

      - name: Validate distributions with twine
        run: twine check dist/*

      - name: Verify py.typed ships in the wheel
        # The package advertises "Typing :: Typed"; without this marker inside
        # the wheel that claim is false and downstream type checkers get nothing.
        run: |
          python -m zipfile -l dist/*.whl | grep -q "urlps/py.typed" \
            || { echo "::error::py.typed missing from wheel"; exit 1; }

      - name: Upload distributions
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          retention-days: 14
