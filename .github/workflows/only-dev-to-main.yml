name: Only dev can merge to master

on:
  pull_request:
    branches:
      - master

jobs:
  check-source-branch:
    runs-on: ubuntu-latest

    steps:
      - name: Verify source branch
        run: |
          if [ "${{ github.head_ref }}" != "dev" ]; then
            echo "Only pull requests from the 'dev' branch can be merged into master."
            exit 1
          fi
