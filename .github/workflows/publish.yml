name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment (testpypi or pypi)'
        required: true
        default: 'testpypi'
        type: choice
        options:
          - testpypi
          - pypi

permissions:
  contents: read

jobs:
  # A release must not be able to ship code that does not pass the suite.
  verify:
    name: Verify before publishing
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install package and dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ".[dev]"

      - name: Run tests
        run: pytest -q --cov=urlps --cov-report=term-missing

      - name: Lint (ruff)
        run: ruff check src/ tests/

      - name: Type check (mypy)
        run: mypy src/urlps --ignore-missing-imports

      - name: Security scan (bandit)
        run: bandit -r src/urlps -ll

      - name: Verify tag matches __version__
        # Guards against tagging v0.7.0 while the package still reports 0.6.1.
        if: github.event_name == 'release'
        shell: bash
        run: |
          pkg_version="$(python -c 'import urlps; print(urlps.__version__)')"
          tag_version="${GITHUB_REF_NAME#v}"
          echo "package=$pkg_version tag=$tag_version"
          if [ "$pkg_version" != "$tag_version" ]; then
            echo "::error::Tag $tag_version does not match __version__ $pkg_version"
            exit 1
          fi

  publish:
    name: Build and publish to PyPI
    runs-on: ubuntu-latest
    needs: verify
    environment:
      name: ${{ github.event_name == 'release' && 'pypi' || github.event.inputs.environment }}
    permissions:
      id-token: write  # Required for trusted publishing
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build package
        run: python -m build

      - name: Validate distributions
        run: twine check dist/*

      # Note: these two conditions are mutually exclusive. The previous version
      # also fired the Test PyPI step for *every* workflow_dispatch, so a manual
      # `pypi` run published to both indexes.
      - name: Publish to Test PyPI
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'testpypi'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true
          verbose: true

      - name: Publish to PyPI
        if: github.event_name == 'release' || github.event.inputs.environment == 'pypi'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          verbose: true
