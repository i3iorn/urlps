[build-system]
# setuptools>=77 is required for PEP 639 `license`/`license-files`
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "urlps"
description = "Secure, RFC 3986-compliant URL parsing with SSRF, homograph and traversal detection."
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.10"
authors = [
  { name = "urlps maintainers" },
]
license = "MIT"
license-files = ["LICENSE"]
keywords = [
  "url", "parser", "builder", "rfc3986", "validation", "idna", "ipv6",
  "punycode", "ipv4", "security", "ssrf", "homograph", "unicode", "uts39",
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Natural Language :: English",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: Implementation :: CPython",
  "Topic :: Internet :: WWW/HTTP",
  "Topic :: Security",
  "Topic :: Software Development :: Libraries",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]
dependencies = []
dynamic = ["version"]

[project.optional-dependencies]
idna = ["idna>=3.11"]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    # Required: tests/security/test_security_fuzzing.py degrades to ~48 silently
    # skipped tests when hypothesis is absent. It must be a hard dev dependency
    # so the property-based security tests actually run in CI.
    "hypothesis>=6.98",
    "mypy>=1.19",
    "bandit>=1.9",
    "ruff>=0.7",
    "idna>=3.11",
    # Generator-only: tools/gen_unicode_tables.py reads UCD Script data from
    # regex to produce src/urlps/_security/_unicode/_tables.py, which is checked
    # in. urlps itself never imports regex at runtime.
    "regex>=2024.0.0",
]

[project.urls]
Homepage = "https://github.com/i3iorn/urlps"
Repository = "https://github.com/i3iorn/urlps"
Documentation = "https://github.com/i3iorn/urlps#readme"
# Points at the aggregate changelog, not a per-version file -- the old
# per-version link went stale on every release.
Changelog = "https://github.com/i3iorn/urlps/blob/master/CHANGELOG.md"
Issues = "https://github.com/i3iorn/urlps/issues"
"Bug Tracker" = "https://github.com/i3iorn/urlps/issues"
Security = "https://github.com/i3iorn/urlps/blob/master/SECURITY.md"

[tool.setuptools.packages.find]
where = ["src"]
include = ["urlps*"]
exclude = ["tests*"]

# PEP 561: ship the py.typed marker so downstream type checkers actually
# consume our annotations. Without this the "Typing :: Typed" classifier
# above is a false claim.
[tool.setuptools.package-data]
urlps = ["py.typed"]

[tool.setuptools.dynamic]
version = {attr = "urlps.__version__"}

# Linting/formatting is consolidated on ruff (it subsumes the previous black +
# isort config, which was declared here but never actually run by CI).
[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["build", "dist", ".venv"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes — real bugs (unused imports/vars, undefined names)
    "I",    # isort — import ordering
    "B",    # flake8-bugbear — likely bugs
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade — was deferred at first (would have swamped
            # behavioural review); applied as its own mechanical pass once
            # the debt (265 -> 296 violations, still growing) was worth
            # clearing on its own. Keep it on so the gap can't reopen.
    "RUF",  # ruff-specific
]
ignore = [
    "E501",    # line length is enforced by the formatter, not the linter
    "B008",    # function call in default arg — not a pattern we use
    "RUF012",  # ClassVar annotations for mutable class attrs — noisy here
    # This library detects homograph/confusable-character attacks, so
    # confusable Unicode in test data, docstrings and comments is the subject
    # matter, not a defect. Flagging it is a false positive by construction.
    "RUF001",  # ambiguous unicode character in string
    "RUF002",  # ambiguous unicode character in docstring
    "RUF003",  # ambiguous unicode character in comment
]

[tool.ruff.lint.per-file-ignores]
# Tests may shadow builtins and use assert-heavy styles freely.
"tests/**" = ["B011"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_untyped_calls = false
warn_unused_ignores = true
warn_redundant_casts = true
warn_no_return = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = ["-v", "--strict-markers", "--tb=short"]
markers = [
    "slow: marks tests as slow",
    "integration: marks tests as integration tests",
    "ipv6: marks IPv6-related tests",
    "idna: marks IDNA-related tests",
    "rfc3986: marks RFC 3986 compliance tests",
]

[tool.coverage.run]
# Measure the installed package by import name, but map it back to the src
# layout so reports resolve against the working tree.
source = ["urlps"]
branch = true

[tool.coverage.paths]
source = ["src/urlps", "*/site-packages/urlps"]

[tool.coverage.report]
# Ratchet upward over time; never lower this to make a red build go green.
fail_under = 92
show_missing = true
skip_covered = true
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
